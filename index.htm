<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Clear+Sans:wght@400;700&display=swap');

        :root {
            --bg-color: #121212;
            --game-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --button-bg: #e67e22; /* Vibrant Orange */
            --button-hover: #d35400;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        /* HUD Overlay */
        #ui-container {
            width: 100%;
            max-width: 500px;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .title-block h1 {
            font-size: 3.5rem;
            margin: 0;
            line-height: 1;
            color: #f1c40f; /* Gold accent for title */
            font-family: arial;
        }

        .score-container {
            display: flex;
            gap: 10px;
        }

        .score-box {
            background: #2c3e50;
            padding: 5px 15px;
            border-radius: 4px;
            text-align: center;
            min-width: 60px;
            color: white;
            border: 1px solid #34495e;
        }

        .score-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #bdc3c7;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Top Controls Area */
        .top-controls {
            width: 100%;
            max-width: 500px;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .game-intro {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: none; /* Hide intro text on mobile/small screens to make room for buttons */
        }
        
        @media (min-width: 400px) {
            .game-intro { display: inline; }
        }

        #game-wrapper {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
        }

        canvas {
            border-radius: 8px;
            background-color: var(--game-bg);
            display: block;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        button {
            background-color: var(--button-bg);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: Arial, sans-serif;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 4px 0 #b35b0e; /* 3D effect */
        }
        
        /* Secondary Buttons (Undo/Redo) */
        button.secondary-btn {
            background-color: #7f8c8d;
            box-shadow: 0 4px 0 #586364;
            padding: 10px 15px;
        }
        
        button.secondary-btn:hover {
            background-color: #95a5a6;
        }
        
        button.secondary-btn:disabled {
            background-color: #3e4647;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.5;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        
        .btn-group {
            display: flex;
            gap: 8px;
        }

        button:hover {
            background-color: var(--button-hover);
        }

        /* Modal Styles */
        #modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 18, 18, 0.85); /* Dark transparent bg */
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #modal-overlay.active {
            opacity: 1;
        }

        .modal-text {
            font-size: 3rem;
            font-weight: 800;
            color: #ecf0f1;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
        }

    </style>
</head>
<body>

    <div id="ui-container">
        <div class="title-block">
            <h1>2048</h1>
        </div>
        <div class="score-container">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div class="score-value" id="score-display">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">Best</div>
                <div class="score-value" id="best-display">0</div>
            </div>
        </div>
    </div>

    <!-- Top Controls: New Game Button moved here -->
    <div class="top-controls">
        <div class="btn-group">
            <button class="secondary-btn" id="btn-undo" onclick="undo()" disabled>Undo</button>
            <button class="secondary-btn" id="btn-redo" onclick="redo()" disabled>Redo</button>
        </div>
        <button onclick="restartGame()">New Game</button>
    </div>

    <div id="game-wrapper">
        <canvas id="game-canvas"></canvas>
        
        
        <div id="modal-overlay">
            <div class="modal-text" id="modal-msg">You Won!</div>
            <div class="modal-buttons">
                <button id="btn-continue" onclick="continueGame()">Keep Going</button>
                <button onclick="restartGame()">Try Again</button>
            </div>
        </div>
    </div>
<p>Swipe to merge tiles. Reach a 2048 tile or further to win.</p>
<script>
/**
 * 2048 Canvas Implementation
 * Uses an Entity-based system for smooth animations.
 * Features: Undo/Redo, IndexedDB Persistence, Dark Mode
 */

// --- Configuration ---
const GRID_SIZE = 4;
const ANIMATION_SPEED = 0.25; 

// --- IndexedDB Setup ---
const DB_NAME = '2048_GameDB_v2';
const DB_VERSION = 1;
const STORE_NAME = 'gameState';
let db;

function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        
        request.onerror = (event) => {
            console.error("IndexedDB error:", event);
            resolve(null); // Continue without DB
        };
        
        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
        };

        request.onsuccess = (event) => {
            db = event.target.result;
            resolve(db);
        };
    });
}

async function saveGame() {
    if (!db) return;
    
    // Serialize tiles (remove methods, keep data)
    const serializedTiles = tiles.map(t => ({
        r: t.r, c: t.c, val: t.val, id: t.id
    }));

    const state = {
        id: 'current_session',
        tiles: serializedTiles,
        score: score,
        bestScore: bestScore,
        historyStack: historyStack,
        futureStack: futureStack,
        isGameOver: isGameOver,
        hasWon: hasWon,
        keepPlaying: keepPlaying
    };

    const transaction = db.transaction([STORE_NAME], 'readwrite');
    const store = transaction.objectStore(STORE_NAME);
    store.put(state);
}

function loadGame() {
    return new Promise((resolve, reject) => {
        if (!db) return resolve(false);

        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get('current_session');

        request.onsuccess = (event) => {
            const state = event.target.result;
            if (state) {
                // Restore State
                score = state.score;
                bestScore = state.bestScore || 0;
                historyStack = state.historyStack || [];
                futureStack = state.futureStack || [];
                isGameOver = state.isGameOver;
                hasWon = state.hasWon;
                keepPlaying = state.keepPlaying;

                // Update UI
                scoreDisplay.innerText = score;
                bestDisplay.innerText = bestScore;
                updateHistoryButtons();

                // Restore Tiles
                tiles = state.tiles.map(d => {
                    let t = new Tile(d.r, d.c, d.val);
                    t.id = d.id;
                    // Snap to target immediately on load
                    t.x = t.getTargetX();
                    t.y = t.getTargetY();
                    t.scale = 1;
                    return t;
                });

                // Restore Modal
                if (hasWon && !keepPlaying) showModal(true);
                else if (isGameOver) showModal(false);
                else closeModal();

                draw();
                resolve(true);
            } else {
                resolve(false);
            }
        };
        request.onerror = () => resolve(false);
    });
}

// Vibrant Dark Mode Colors
const BG_GRID_COLOR = "#2a2a2a";
const TILE_COLORS = {
    0:   "#2a2a2a",   
    2:   "#00d2d3",   
    4:   "#2e86de",   
    8:   "#5f27cd",   
    16:  "#ff9f43",   
    32:  "#ee5253",   
    64:  "#10ac84",   
    128: "#222f3e",   
    256: "#eca0b5",   
    512: "#54a0ff",   
    1024:"#576574",   
    2048:"#feca57",   
    super: "#341f97"  
};

const TEXT_COLOR_DEFAULT = "#ffffff";
const TEXT_COLORS = {
    2: "#ffffff",
    4: "#ffffff",
    others: "#ffffff"
};

// --- State ---
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('score-display');
const bestDisplay = document.getElementById('best-display');
const modal = document.getElementById('modal-overlay');
const modalMsg = document.getElementById('modal-msg');
const btnContinue = document.getElementById('btn-continue');
const btnUndo = document.getElementById('btn-undo');
const btnRedo = document.getElementById('btn-redo');

let tiles = []; 
let score = 0;
let historyStack = [];
let futureStack = [];

let bestScore = 0;
let cellSize = 0;
let gapSize = 0;
let isGameOver = false;
let hasWon = false;
let keepPlaying = false;

// --- Initialization ---
async function init() {
    resizeCanvas();
    window.addEventListener('resize', () => {
        resizeCanvas();
        draw();
    });
    
    // Initialize DB and try to load save
    await initDB();
    const loaded = await loadGame();
    
    if (!loaded) {
        // Fallback to localstorage best score if new game
        bestScore = localStorage.getItem('2048-best') || 0;
        bestDisplay.innerText = bestScore;
        restartGame();
    }

    loop();
}

function restartGame() {
    tiles = [];
    score = 0;
    historyStack = [];
    futureStack = [];
    updateHistoryButtons();
    
    isGameOver = false;
    hasWon = false;
    keepPlaying = false;
    updateScore(0);
    closeModal();
    
    addRandomTile();
    addRandomTile();
    
    saveGame(); // Save initial state
}

function resizeCanvas() {
    const maxWidth = 500;
    const padding = 40; 
    const availableWidth = Math.min(window.innerWidth - padding, window.innerHeight - 250);
    const size = Math.min(maxWidth, availableWidth);

    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';

    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.scale(dpr, dpr);

    gapSize = size * 0.03; 
    cellSize = (size - (gapSize * (GRID_SIZE + 1))) / GRID_SIZE;
}

// --- Game Logic ---

class Tile {
    constructor(r, c, val) {
        this.r = r; 
        this.c = c; 
        this.val = val;
        this.id = Math.random().toString(36).substr(2, 9);
        
        this.x = this.getTargetX();
        this.y = this.getTargetY();
        
        this.scale = 0;
        this.isMerged = false; 
        this.toDelete = false; 
    }

    getTargetX() { return gapSize + this.c * (cellSize + gapSize); }
    getTargetY() { return gapSize + this.r * (cellSize + gapSize); }

    update() {
        const targetX = this.getTargetX();
        const targetY = this.getTargetY();

        this.x += (targetX - this.x) * ANIMATION_SPEED;
        this.y += (targetY - this.y) * ANIMATION_SPEED;

        if (this.toDelete) {
            this.scale -= 0.1;
            if (this.scale < 0) this.scale = 0;
        } else if (this.scale < 1) {
            this.scale += 0.15;
            if (this.scale > 1) this.scale = 1;
        }

        if (this.isMerged) {
            this.isMerged = false;
            this.scale = 1.2; 
        }
        if (this.scale > 1) {
            this.scale -= 0.05; 
        }
    }
}

function getTileAt(r, c) {
    return tiles.find(t => t.r === r && t.c === c && !t.toDelete);
}

function addRandomTile() {
    let emptyCells = [];
    for(let r=0; r<GRID_SIZE; r++) {
        for(let c=0; c<GRID_SIZE; c++) {
            if(!getTileAt(r,c)) emptyCells.push({r,c});
        }
    }
    if(emptyCells.length > 0) {
        let cell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        let val = Math.random() < 0.9 ? 2 : 4;
        tiles.push(new Tile(cell.r, cell.c, val));
    }
}

function updateScore(add) {
    score += add;
    scoreDisplay.innerText = score;
    if(score > bestScore) {
        bestScore = score;
        localStorage.setItem('2048-best', bestScore); // Keep this for robustness
        bestDisplay.innerText = bestScore;
    }
}

// --- History & State Management ---
function captureState() {
    return {
        tiles: tiles.map(t => ({
            r: t.r, 
            c: t.c, 
            val: t.val,
            id: t.id
        })),
        score: score,
        hasWon: hasWon,
        isGameOver: isGameOver,
        keepPlaying: keepPlaying
    };
}

function restoreState(state) {
    score = state.score;
    scoreDisplay.innerText = score;
    hasWon = state.hasWon;
    isGameOver = state.isGameOver;
    keepPlaying = state.keepPlaying;
    
    const currentTiles = tiles; 
    const restoredTiles = [];

    state.tiles.forEach(data => {
        let t = new Tile(data.r, data.c, data.val);
        t.id = data.id; 
        
        const match = currentTiles.find(ct => ct.id === t.id);
        if (match) {
            t.x = match.x;
            t.y = match.y;
            t.scale = match.scale;
        } else {
            t.x = t.getTargetX();
            t.y = t.getTargetY();
            t.scale = 0; 
        }
        restoredTiles.push(t);
    });

    currentTiles.forEach(ct => {
        if (!restoredTiles.find(rt => rt.id === ct.id)) {
            ct.toDelete = true;
            restoredTiles.push(ct);
        }
    });

    tiles = restoredTiles;
    
    if(!hasWon && !isGameOver) {
        modal.classList.remove('active');
        modal.style.display = 'none';
    } else if(hasWon && !keepPlaying) {
        showModal(true);
    } else if(isGameOver) {
        showModal(false);
    }
}

function updateHistoryButtons() {
    btnUndo.disabled = historyStack.length === 0;
    btnRedo.disabled = futureStack.length === 0;
}

function undo() {
    if (historyStack.length === 0) return;
    futureStack.push(captureState());
    let prevState = historyStack.pop();
    restoreState(prevState);
    updateHistoryButtons();
    saveGame(); // Save after action
}

function redo() {
    if (futureStack.length === 0) return;
    historyStack.push(captureState());
    let nextState = futureStack.pop();
    restoreState(nextState);
    updateHistoryButtons();
    saveGame(); // Save after action
}

// --- Move Engine ---
function move(direction) {
    if(isGameOver || (hasWon && !keepPlaying && modal.style.display === 'flex')) return;

    let startState = captureState();

    let vector = {r:0, c:0};
    if(direction === 'ArrowUp') vector.r = -1;
    if(direction === 'ArrowDown') vector.r = 1;
    if(direction === 'ArrowLeft') vector.c = -1;
    if(direction === 'ArrowRight') vector.c = 1;

    let moved = false;
    let mergedIds = new Set(); 

    let rs = vector.r === 1 ? GRID_SIZE-1 : 0;
    let re = vector.r === 1 ? -1 : GRID_SIZE;
    let rd = vector.r === 1 ? -1 : 1;

    let cs = vector.c === 1 ? GRID_SIZE-1 : 0;
    let ce = vector.c === 1 ? -1 : GRID_SIZE;
    let cd = vector.c === 1 ? -1 : 1;

    for(let r = rs; r !== re; r += rd) {
        for(let c = cs; c !== ce; c += cd) {
            let tile = getTileAt(r, c);
            if(tile) {
                let nextR = r;
                let nextC = c;
                
                while(true) {
                    let checkR = nextR + vector.r;
                    let checkC = nextC + vector.c;
                    
                    if(checkR < 0 || checkR >= GRID_SIZE || checkC < 0 || checkC >= GRID_SIZE) break;
                    
                    let obstacle = getTileAt(checkR, checkC);
                    if(obstacle) {
                        if(obstacle.val === tile.val && !mergedIds.has(obstacle.id)) {
                            obstacle.toDelete = true; 
                            tile.toDelete = true; 
                            
                            let mergedTile = new Tile(checkR, checkC, tile.val * 2);
                            mergedTile.scale = 0.8; 
                            mergedTile.isMerged = true;
                            tiles.push(mergedTile);
                            
                            mergedIds.add(mergedTile.id);
                            updateScore(mergedTile.val);
                            
                            if(mergedTile.val === 2048 && !hasWon) {
                                hasWon = true;
                                setTimeout(() => showModal(true), 300);
                            }
                            moved = true;
                        }
                        break; 
                    }
                    nextR = checkR;
                    nextC = checkC;
                }

                if(nextR !== r || nextC !== c) {
                    if(!tile.toDelete) {
                       tile.r = nextR;
                       tile.c = nextC;
                       moved = true;
                    }
                }
            }
        }
    }

    if(moved) {
        historyStack.push(startState);
        futureStack = [];
        updateHistoryButtons();
        addRandomTile();
        checkGameOver();
        saveGame(); // Save after move
    }
}

function checkGameOver() {
    if(tiles.filter(t => !t.toDelete).length < GRID_SIZE*GRID_SIZE) return;

    for(let r=0; r<GRID_SIZE; r++) {
        for(let c=0; c<GRID_SIZE; c++) {
            let t = getTileAt(r,c);
            if(t) {
                let neighbors = [
                    getTileAt(r+1, c),
                    getTileAt(r, c+1)
                ];
                for(let n of neighbors) {
                    if(n && n.val === t.val) return; 
                }
            }
        }
    }

    isGameOver = true;
    setTimeout(() => showModal(false), 1000);
    saveGame(); // Save game over state
}

// --- Rendering ---
function drawRoundRect(x, y, w, h, r, color, glow = false) {
    ctx.fillStyle = color;
    if (glow) {
        ctx.shadowBlur = 10;
        ctx.shadowColor = color;
    } else {
        ctx.shadowBlur = 0;
    }
    
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.fill();
    ctx.shadowBlur = 0; 
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height); 

    for(let r=0; r<GRID_SIZE; r++) {
        for(let c=0; c<GRID_SIZE; c++) {
            let x = gapSize + c * (cellSize + gapSize);
            let y = gapSize + r * (cellSize + gapSize);
            drawRoundRect(x, y, cellSize, cellSize, 6, BG_GRID_COLOR);
        }
    }

    tiles = tiles.filter(t => !(t.toDelete && t.scale <= 0.05));

    tiles.forEach(t => {
        t.update(); 

        let size = cellSize * t.scale;
        let offset = (cellSize - size) / 2;
        let x = t.x + offset;
        let y = t.y + offset;
        
        let bgColor = TILE_COLORS[t.val] || TILE_COLORS.super;
        let textColor = TEXT_COLOR_DEFAULT;
        let isGlow = t.val >= 8;

        drawRoundRect(x, y, size, size, 4, bgColor, isGlow);

        ctx.fillStyle = textColor;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        let fontSize = cellSize * 0.5;
        if(t.val > 100) fontSize = cellSize * 0.4;
        if(t.val > 1000) fontSize = cellSize * 0.35;
        
        ctx.font = `bold ${fontSize}px Arial`;
        ctx.fillText(t.val, x + size/2, y + size/2 + size*0.05);
    });
}

function loop() {
    draw();
    requestAnimationFrame(loop);
}

// --- Input Handling ---
document.addEventListener('keydown', (e) => {
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
        e.preventDefault();
        move(e.key);
    }
});

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    e.preventDefault();
}, {passive: false});

canvas.addEventListener('touchend', (e) => {
    if(!touchStartX || !touchStartY) return;
    handleGesture(touchStartX, touchStartY, e.changedTouches[0].clientX, e.changedTouches[0].clientY);
    touchStartX = 0; touchStartY = 0;
    e.preventDefault();
}, {passive: false});

let mouseStartX = 0;
let mouseStartY = 0;
let isMouseDown = false;

canvas.addEventListener('mousedown', (e) => {
    isMouseDown = true;
    mouseStartX = e.clientX;
    mouseStartY = e.clientY;
});

canvas.addEventListener('mouseup', (e) => {
    if(!isMouseDown) return;
    isMouseDown = false;
    handleGesture(mouseStartX, mouseStartY, e.clientX, e.clientY);
});

canvas.addEventListener('mouseleave', () => {
    isMouseDown = false;
});

function handleGesture(startX, startY, endX, endY) {
    let dx = endX - startX;
    let dy = endY - startY;
    const threshold = 30; 

    if(Math.abs(dx) > Math.abs(dy)) {
        if(Math.abs(dx) > threshold) {
            move(dx > 0 ? 'ArrowRight' : 'ArrowLeft');
        }
    } else {
        if(Math.abs(dy) > threshold) {
            move(dy > 0 ? 'ArrowDown' : 'ArrowUp');
        }
    }
}

// --- Modal Logic ---
function showModal(won) {
    modal.style.display = 'flex';
    modal.offsetHeight; 
    modal.classList.add('active');

    if(won) {
        modalMsg.innerText = "You Won!";
        btnContinue.style.display = 'inline-block';
    } else {
        modalMsg.innerText = "Game Over";
        btnContinue.style.display = 'none';
    }
}

function closeModal() {
    modal.classList.remove('active');
    setTimeout(() => {
        modal.style.display = 'none';
    }, 300);
}

function continueGame() {
    keepPlaying = true;
    closeModal();
    saveGame();
}

// Start
init();

</script>
</body>
</html>
